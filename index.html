<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Valentine?</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #ffd6e8, #ffeaf3);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Poppins", system-ui, sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      z-index: 2;
    }

    h1 {
      font-size: 3rem;
      color: #b4004e;
      margin-bottom: 40px;
    }

    .btn {
      padding: 16px 40px;
      font-size: 20px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      margin: 10px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: scale(1.07);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }

    #yes {
      background: linear-gradient(135deg, #ff5fa2, #ff2f7d);
      color: white;
    }

    #no {
      background: linear-gradient(135deg, #9f1239, #be123c);
      color: white;
      position: fixed;
      left: 60%;
      top: 60%;
    }

    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      font-size: 24px;
      animation: floatUp 6s linear infinite;
      opacity: 0.7;
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh) scale(1);
      }
      to {
        transform: translateY(-10vh) scale(1.4);
      }
    }
  </style>
</head>
<body>

  <div class="hearts"></div>

  <div class="container">
    <h1>Will you be my Valentine? 💕</h1>
    <button id="yes" class="btn"
      onclick="yesClicked()">
      Yes 💖
    </button>
  </div>

  <button id="no" class="btn">No 💔</button>

  <script>
    const noBtn = document.getElementById("no");

    let x = window.innerWidth * 0.6;
    let y = window.innerHeight * 0.6;

    let vx = 0;
    let vy = 0;

    const repelDistance = 140;
    const acceleration = 1.2;
    const friction = 0.92;

    document.addEventListener("mousemove", (e) => {
      const dx = x - e.clientX;
      const dy = y - e.clientY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < repelDistance) {
        vx += (dx / dist) * acceleration;
        vy += (dy / dist) * acceleration;
      }
    });

    function animate() {
      x += vx;
      y += vy;

      // bounce from edges instead of stopping
      if (x < 0 || x > window.innerWidth - noBtn.offsetWidth) {
        vx *= -1;
      }
      if (y < 0 || y > window.innerHeight - noBtn.offsetHeight) {
        vy *= -1;
      }

      vx *= friction;
      vy *= friction;

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";

      requestAnimationFrame(animate);
    }

    animate();

    function yesClicked() {
      alert("Yayyy 💘 I knew it! Happy Valentine’s Day 🥰");
    }

    // floating hearts
    const heartsContainer = document.querySelector(".hearts");
    const emojis = ["💖", "💕", "💘", "💗", "💓"];

    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = 4 + Math.random() * 3 + "s";
      heartsContainer.appendChild(heart);

      setTimeout(() => heart.remove(), 7000);
    }, 400);
  </script>

</body>
</html>
