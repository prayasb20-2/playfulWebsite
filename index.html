<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Valentine?</title>

  <style>
    body {
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #ffd6e8, #ffeaf3);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Poppins", system-ui, sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      z-index: 3;
    }

    h1 {
      font-size: 3rem;
      color: #b4004e;
      margin-bottom: 40px;
    }

    .btn {
      padding: 16px 40px;
      font-size: 20px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      margin: 10px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: scale(1.07);
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    }

    #yes {
      background: linear-gradient(135deg, #ff5fa2, #ff2f7d);
      color: white;
    }

    #no {
      background: linear-gradient(135deg, #9f1239, #be123c);
      color: white;
      position: fixed;
      left: 60%;
      top: 60%;
    }

    /* floating hearts */
    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .heart {
      position: absolute;
      font-size: 24px;
      animation: floatUp linear forwards;
      opacity: 0.8;
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh) scale(1);
        opacity: 0.8;
      }
      to {
        transform: translateY(-10vh) scale(1.5);
        opacity: 0;
      }
    }

    /* celebration */
    .celebration {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .burst {
      position: absolute;
      font-size: 28px;
      animation: burst 1.6s ease-out forwards;
    }

    @keyframes burst {
      0% { transform: scale(0); opacity: 1; }
      100% { transform: scale(2) translateY(-120px); opacity: 0; }
    }

    .message {
      font-size: 2.6rem;
      color: #b4004e;
      margin-top: 30px;
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <div class="hearts"></div>
  <div class="celebration" id="celebration"></div>

  <div class="container" id="main">
    <h1>Hey Shivangi...Will you be my Valentine? 💕</h1>
    <button id="yes" class="btn">Yes 💖</button>
  </div>

  <button id="no" class="btn">No 💔</button>

  <script>
    /* ===== OLD SMOOTH NO BUTTON PHYSICS ===== */
    const noBtn = document.getElementById("no");

    let x = window.innerWidth * 0.6;
    let y = window.innerHeight * 0.6;
    let vx = 0, vy = 0;

    const repelDistance = 140;
    const acceleration = 1.4;
    const friction = 0.94;

    document.addEventListener("mousemove", (e) => {
      const dx = x - e.clientX;
      const dy = y - e.clientY;
      const dist = Math.hypot(dx, dy);

      if (dist < repelDistance) {
        vx += (dx / dist) * acceleration;
        vy += (dy / dist) * acceleration;
      }
    });

    function animate() {
      x += vx;
      y += vy;

      // bounce, no corner sticking
      if (x < 0 || x > window.innerWidth - noBtn.offsetWidth) {
        vx *= -1;
        x = Math.max(0, Math.min(x, window.innerWidth - noBtn.offsetWidth));
      }
      if (y < 0 || y > window.innerHeight - noBtn.offsetHeight) {
        vy *= -1;
        y = Math.max(0, Math.min(y, window.innerHeight - noBtn.offsetHeight));
      }

      vx *= friction;
      vy *= friction;

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";

      requestAnimationFrame(animate);
    }
    animate();

    /* ===== FLOATING HEARTS (OLD) ===== */
    const heartsContainer = document.querySelector(".hearts");
    const emojis = ["💖", "💕", "💘", "💗", "💓"];

    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = 18 + Math.random() * 18 + "px";
      heart.style.animationDuration = 4 + Math.random() * 4 + "s";
      heartsContainer.appendChild(heart);
      setTimeout(() => heart.remove(), 8000);
    }, 400);

    /* ===== NEW YES CLICK CELEBRATION ===== */
    const celebration = document.getElementById("celebration");
    const main = document.getElementById("main");

    document.getElementById("yes").onclick = () => {
      noBtn.remove();
      main.innerHTML =
        "<div class='message'>Yayyy 💘 I knew it!<br>Happy Valentine’s Day Babe 🥰</div>";
      launchCelebration();
    };

    function launchCelebration() {
      for (let i = 0; i < 120; i++) {
        const burst = document.createElement("div");
        burst.className = "burst";
        burst.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        burst.style.left = "50%";
        burst.style.top = "50%";
        burst.style.transform =
          `translate(-50%, -50%) translate(${Math.random()*400-200}px, ${Math.random()*400-200}px)`;
        celebration.appendChild(burst);
        setTimeout(() => burst.remove(), 1600);
      }
    }
  </script>

</body>
</html>
