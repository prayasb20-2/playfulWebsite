<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Valentine?</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #ffd6e8, #ffeaf3);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Poppins", system-ui, sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      z-index: 2;
    }

    h1 {
      font-size: 3rem;
      color: #b4004e;
      margin-bottom: 40px;
    }

    .btn {
      padding: 16px 40px;
      font-size: 20px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      margin: 10px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: scale(1.07);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }

    #yes {
      background: linear-gradient(135deg, #ff5fa2, #ff2f7d);
      color: white;
    }

    #no {
      background: linear-gradient(135deg, #9f1239, #be123c);
      color: white;
      position: fixed;
      left: 60%;
      top: 60%;
    }

    #taunt {
      position: fixed;
      font-size: 18px;
      color: #9f1239;
      font-weight: 600;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .celebration {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .heart {
      position: absolute;
      font-size: 26px;
      animation: pop 1.5s ease-out forwards;
    }

    @keyframes pop {
      0% { transform: scale(0); opacity: 1; }
      100% { transform: scale(2) translateY(-120px); opacity: 0; }
    }

    .message {
      font-size: 2.5rem;
      color: #b4004e;
      margin-top: 30px;
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container" id="main">
    <h1>Will you be my Valentine? 💕</h1>
    <button id="yes" class="btn">Yes 💖</button>
  </div>

  <button id="no" class="btn">No 💔</button>
  <div id="taunt"></div>
  <div class="celebration" id="celebration"></div>

  <script>
    const noBtn = document.getElementById("no");
    const taunt = document.getElementById("taunt");
    const celebration = document.getElementById("celebration");
    const main = document.getElementById("main");

    let x = window.innerWidth * 0.6;
    let y = window.innerHeight * 0.6;
    let vx = 0, vy = 0;

    const repelDistance = 140;
    const accel = 1.3;
    const friction = 0.92;

    const taunts = [
      "Nice try 😜",
      "Almost!",
      "That was close 👀",
      "Nope 😏",
      "Too slow!"
    ];

    document.addEventListener("mousemove", (e) => {
      const dx = x - e.clientX;
      const dy = y - e.clientY;
      const dist = Math.hypot(dx, dy);

      if (dist < repelDistance) {
        vx += (dx / dist) * accel;
        vy += (dy / dist) * accel;

        taunt.textContent = taunts[Math.floor(Math.random() * taunts.length)];
        taunt.style.opacity = 1;
      }
    });

    function animate() {
      x += vx;
      y += vy;

      if (x < 0 || x > window.innerWidth - noBtn.offsetWidth) vx *= -1;
      if (y < 0 || y > window.innerHeight - noBtn.offsetHeight) vy *= -1;

      vx *= friction;
      vy *= friction;

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";

      taunt.style.left = (x + 20) + "px";
      taunt.style.top = (y - 30) + "px";

      requestAnimationFrame(animate);
    }
    animate();

    document.getElementById("yes").onclick = () => {
      noBtn.remove();
      taunt.remove();
      main.innerHTML = "<div class='message'>Yayyy 💘 I knew it!<br>Happy Valentine’s Day 🥰</div>";
      confettiAndHearts();
    };

    function confettiAndHearts() {
      const emojis = ["💖", "💘", "💕", "💗", "💓"];
      for (let i = 0; i < 120; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        heart.style.left = "50%";
        heart.style.top = "50%";
        heart.style.fontSize = 20 + Math.random() * 20 + "px";
        heart.style.transform = `translate(-50%, -50%) translate(${Math.random()*400-200}px, ${Math.random()*400-200}px)`;
        celebration.appendChild(heart);
        setTimeout(() => heart.remove(), 1500);
      }
    }
  </script>

</body>
</html>
